
services:
  mysql:
    image: mysql:8.0
    container_name: umkm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: P@ssw0rd
      MYSQL_DATABASE: umkm_erp
      MYSQL_USER: umkm_user
      MYSQL_PASSWORD: P@ssw0rd
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
 

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: umkm-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=umkm_erp
      - DB_USER=umkm_user
      - DB_PASSWORD=P@ssw0rd
      - FRONTEND_URL=http://localhost:5173
      - MIDTRANS_IS_PRODUCTION=false
      - MIDTRANS_SERVER_KEY=SB-Mid-server-gx4JkQdgQqzCwl7_EvTVcPY_
      - MIDTRANS_CLIENT_KEY=SB-Mid-client-rNNBHx8BwcQuFDDm
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook
    env_file:
          - .env.production
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: umkm-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

  n8n:
    image: n8nio/n8n:latest
    container_name: umkm-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin
      - N8N_WEBHOOK_URL=http://n8n:5678
      - N8N_HOST=0.0.0.0
      - GENERIC_TIMEZONE=Asia/Jakarta
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-workflows:/home/node/workflows
    depends_on:
      - backend

volumes:
  mysql_data:
  n8n_data:
 